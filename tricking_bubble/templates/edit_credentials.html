{% extends 'base.html' %}
{% block content %}
    <div class="screen-container authenticate">
        <!-- onsubmit='return validateForm();' se true manda a django, se false no-->
        <form action="" method="post" onsubmit="return validateForm();" id="authenticate" enctype="multipart/form-data">
            {% csrf_token %}
            <h2>Modifica:</h2>
                {% if err_utente is not None %}
                    <div class="err-popup">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <p>{{ err_utente }}</p>
                    </div>
                {% endif %}
                <hr id="separator">
                <!-- Campi per la modifica -->
                <label for="email">Modifica email:</label>
                
                <input type="email" name="email" class="inputField" value="{{ email }}" required>
                <label for="data_nascita">Modifica data_nascita:</label>
                <input id="data_nascita" type="date" name="data_nascita" class="inputField" value="{{ data_nascita }}" 
                    min="1950-01-01" max="2023-01-01" >

                <label for="img-profilo">
                    Modifica immagine profilo:
                </label>
                <label for="input-file" id="file-upload">
                    <i class="fa-solid fa-camera" aria-hidden="true"></i>
                    <p id="img-caption"> Seleziona un'immagine: </p>
                    <input type="file" name="img_profilo" accept="image/png, image/jpg, image/gif, image/jpeg" id="input-file" onchange="changeImgCaption();">
                </label>
                <label for="empty_img" id="empty_img">
                    <p>
                        Rimuovi immagine profilo
                        <input type="checkbox" name="img_profilo" value="" id="empty_img">
                    </p>
                    
                </label>
                <button type="submit">Invia</button>
                <p> 
                    Non devi modificare nulla? 
                    <a href="{% url 'profile' %}">Torna indietro</a>
                </p>
        </form>
    </div>
    {% load static %}
    <script src="{% static 'scripts/authenticate_script.js' %}"></script>
{% endblock %}
